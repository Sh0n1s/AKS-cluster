apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  logs.json: |
    {
      "uid": "cluster-logs",
      "title": "Logs / Cluster and apps",
      "tags": ["logs", "loki"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": "label_values(namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Lines per second",
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 1 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({namespace=~\"$namespace\"}[5m]))"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Log volume by namespace",
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 5, "w": 18, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 1, "fillOpacity": 30, "stacking": { "mode": "normal" } }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate({namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Demo app requests by HTTP status",
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 1, "fillOpacity": 30, "stacking": { "mode": "normal" } }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate({namespace=\"ingress-nginx\"} |= \"demo-\" | pattern `<_> - <_> [<_>] \"<_>\" <status> <_>` [5m]))",
              "legendFormat": "HTTP {{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Ingress traffic to demo apps",
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"ingress-nginx\"} |= \"demo-\""
            }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Errors across selected namespaces",
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 22 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=~\"$namespace\"} |~ \"(?i)error\""
            }
          ]
        }
      ]
    }