apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sh0n1s/AKS-cluster.git
    targetRevision: main
    path: k8s/monitoring/alerting
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true