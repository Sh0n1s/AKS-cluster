apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.14.1
    helm:
      values: |
        replicaCount: 0
        serviceMonitor:
          enabled: true
        backend: http://backend-podinfo:9898/echo
        ui:
          message: "I am the FRONTEND"
          color: "#34577c"
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: frontend.134.112.159.209.nip.io
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true